<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>La Fuga — Business</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="description" content="Quotations, unit economics, sales and statutory deadlines for La Fuga Cycling Society." />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="La Fuga" />
    <meta name="color-scheme" content="light" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar">
        <a class="brand" href="#/today" aria-label="La Fuga — home">
          <img src="assets/lockup-black.png" alt="La Fuga Cycling Society" class="brand-mark" />
        </a>
        <button class="topbar-action" type="button" data-route="#/settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
            <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path
              d="M12 2.6l1.5 2.5 2.9-.5.6 2.9 2.5 1.5-1.6 2.5 1.6 2.5-2.5 1.5-.6 2.9-2.9-.5L12 21.4l-1.5-2.5-2.9.5-.6-2.9L4.5 15l1.6-2.5L4.5 10l2.5-1.5.6-2.9 2.9.5z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </header>

      <main id="view" class="view" tabindex="-1"></main>

      <nav class="tabbar" aria-label="Sections">
        <a href="#/today" data-tab="today">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
          <span>Today</span>
        </a>
        <a href="#/quotes" data-tab="quotes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm7 1.8V8h3.2zM8 12h8v1.6H8zm0 3.4h8V17H8zm0-6.8h3.5v1.6H8z"/></svg>
          <span>Quotes</span>
        </a>
        <a href="#/products" data-tab="products">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l4.5 2.4-1.7 3.6-2-.9V20a1 1 0 0 1-1 1H9.2a1 1 0 0 1-1-1V9.1l-2 .9L4.5 6.4z"/></svg>
          <span>Products</span>
        </a>
        <a href="#/sales" data-tab="sales">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.2h16V21H3a1 1 0 0 1-1-1V3h1.9zM7 15V9.5h2.6V15zm4.6 0V5.5h2.6V15zm4.6 0v-7.6h2.6V15z"/></svg>
          <span>Sales</span>
        </a>
        <a href="#/dates" data-tab="dates">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2.5h1.8v2H15v-2h1.8v2H19a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1h2zM5.8 9.4V19h12.4V9.4zm2.4 2.2h2.2v2.2H8.2zm4 0h2.2v2.2h-2.2z"/></svg>
          <span>Dates</span>
        </a>
      </nav>
    </div>

    <noscript>
      <p style="padding: 2rem; font-family: system-ui">This app needs JavaScript. Everything runs on your phone — nothing is sent anywhere.</p>
    </noscript>

    <script src="vendor/jspdf.umd.min.js"></script>
    <script type="module" src="js/app.js"></script>

</html>
